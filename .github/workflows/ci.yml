name: CI

# Comprueba cada push y pull request. Va separado del workflow semanal a
# propósito: un aviso del linter nunca debe impedir que se capture el
# snapshot de la semana. Los commits de datos que hace el bot con
# GITHUB_TOKEN no disparan este workflow.
"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Linter (ruff)
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

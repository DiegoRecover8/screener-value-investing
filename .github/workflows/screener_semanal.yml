name: Screener semanal

# Se ejecuta cada lunes a las 07:00 UTC y añade el resultado a
# journal_candidatos.csv (nunca lo sobrescribe, ver journal.py). También se
# puede lanzar a mano desde la pestaña "Actions" de GitHub.
"on":
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests (no seguir si el motor está roto)
        run: python -m pytest test_screener.py test_journal.py -q

      - name: Ejecutar el screener sobre universo.txt y actualizar el journal
        run: python ejecutar_semanal.py universo.txt journal_candidatos.csv

      - name: Commitear el journal si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journal_candidatos.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en el journal"
          else
            git commit -m "Actualiza journal semanal ($(date -u +%Y-%m-%d))"
            git push
          fi

name: Screener semanal

# Se ejecuta cada lunes a las 07:00 UTC y añade el resultado a
# journal_candidatos.csv, ejecuciones_screener.csv y seguimiento_candidatas.csv
# (ninguno se sobrescribe, ver journal.py y seguimiento.py). También se puede
# lanzar a mano desde la pestaña "Actions" de GitHub.
"on":
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "Guardar como prueba o como revisión oficial de la semana"
        required: true
        default: prueba
        type: choice
        options:
          - prueba
          - oficial

# Una ejecución nueva espera a que termine la activa. Nunca se cancela una
# descarga que ya podría estar a punto de escribir el histórico.
concurrency:
  group: screener-historico
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    # El screener suele tardar unos minutos; este límite evita runners
    # bloqueados durante horas si Yahoo o una dependencia dejan de responder.
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests (no seguir si el motor está roto)
        run: python -m pytest -q

      - name: Ejecutar el screener sobre universo.txt y actualizar el journal
        run: python ejecutar_semanal.py universo.txt journal_candidatos.csv
        env:
          SCREENER_ORIGEN: ${{ github.event_name }}
          SCREENER_OFICIAL: ${{ github.event_name == 'schedule' || inputs.modo == 'oficial' }}

      - name: Calcular rendimiento de las candidatas trackeadas
        if: ${{ github.event_name == 'schedule' || inputs.modo == 'oficial' }}
        run: >-
          python ejecutar_seguimiento.py journal_candidatos.csv
          seguimiento_candidatas.csv ejecuciones_screener.csv

      - name: Exportar la Bitácora desde el mismo snapshot oficial
        if: ${{ github.event_name == 'schedule' || inputs.modo == 'oficial' }}
        run: python exportar_historico.py > historico.json

      - name: Commitear journal, control, seguimiento y JSON si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journal_candidatos.csv ejecuciones_screener.csv seguimiento_candidatas.csv historico.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "Actualiza journal y seguimiento semanal ($(date -u +%Y-%m-%d))"
            git push
          fi

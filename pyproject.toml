[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "value-investing-screener-core"
version = "0.1.0"
description = "Educational value-investing research engine with auditable filters and versioned universes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dashboard = [
    "altair>=5.0",
    "streamlit>=1.56",
]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["prompt_llm", "screener_api", "screener_value"]

[tool.setuptools.packages.find]
include = ["providers*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
